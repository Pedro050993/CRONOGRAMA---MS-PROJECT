[project]
name = "docproc"
version = "0.1.0"
description = "Worker de processamento documental: PDF e imagem para Markdown rastreavel e entidades tecnicas"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
