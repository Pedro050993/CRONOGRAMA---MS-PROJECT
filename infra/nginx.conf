server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Cabecalhos de seguranca. O frontend nao guarda segredo, mas nao precisa
  # ser um vetor conveniente.
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location /api/ {
    proxy_pass http://api:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # SSE precisa de buffer desligado e timeout longo, senao o canal de eventos
    # do projeto cai a cada poucos minutos.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    chunked_transfer_encoding off;

    client_max_body_size 512m;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
